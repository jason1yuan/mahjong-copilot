[package]
name = "mahjong-copilot"
description = "Offline mahjong copilot"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
# Distinct from the bin name; see https://github.com/rust-lang/cargo/issues/8519
name = "mahjong_copilot_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ort.workspace = true
mahjong-core.workspace = true
mahjong-models.workspace = true
mahjong-perception.workspace = true
# ⌥ Space to show and hide the panel (#2); official Tauri plugin, MIT OR Apache-2.0.
tauri-plugin-global-shortcut = "=2.4.0"

[target.'cfg(target_os = "macos")'.dependencies]
# Makes the window a panel that does not take focus from the game (#2); MIT OR Apache-2.0.
tauri-nspanel = "=2.1.1"

[features]
# The dev tools (#8) in a packaged app: the debug row, screenshots and continuous
# recording. Built as its own app, "Mahjong Copilot Dev" (see tauri.dev.conf.json), by
# .github/workflows/dev-build.yml with each release or by hand; never released.
dev-tools = []

[lints]
workspace = true

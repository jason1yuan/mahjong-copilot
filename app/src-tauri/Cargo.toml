[package]
name = "mahjong-copilot"
description = "Offline mahjong copilot"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
# Distinct from the bin name; see https://github.com/rust-lang/cargo/issues/8519
name = "mahjong_copilot_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
mahjong-core.workspace = true
mahjong-models.workspace = true
mahjong-perception.workspace = true

[lints]
workspace = true

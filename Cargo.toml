[workspace]
resolver = "3"
members = ["app/src-tauri", "core", "models", "perception"]
# Vendored upstream code is kept as-is and not linted with our rules.
exclude = ["third_party/libriichi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
anyhow = "1"
mahjong-core = { path = "core" }
mahjong-models = { path = "models" }
mahjong-perception = { path = "perception" }
libriichi-algo = { path = "third_party/libriichi" }
image = { version = "0.25", default-features = false }
# Prebuilt ONNX Runtime 1.31 is downloaded at build time only; `fetch-models` (downloads
# at run time) stays off.
# macOS's on-device text recognition (Vision), for the round label (#9).
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSEnumerator", "NSError", "NSString"] }
objc2-vision = { version = "0.3", default-features = false, features = ["std", "VNObservation", "VNRecognizeTextRequest", "VNRequest", "VNRequestHandler", "VNTypes"] }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "tracing", "download-binaries", "tls-native", "copy-dylibs", "api-31"] }
# macOS window capture (#1); macos_14_0 matches the app's minimum macOS.
screencapturekit = { version = "11.0", features = ["macos_14_0"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Only for downloading models (the `models` crate): bundled rustls roots, no gzip, so a
# resumed download is the raw bytes.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

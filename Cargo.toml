[workspace]
resolver = "3"
members = ["app/src-tauri", "core", "perception"]
# Vendored upstream code is kept as-is and not linted with our rules.
exclude = ["third_party/libriichi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
mahjong-core = { path = "core" }
mahjong-perception = { path = "perception" }
libriichi-algo = { path = "third_party/libriichi" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

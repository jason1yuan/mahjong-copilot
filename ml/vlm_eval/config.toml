# VLM selection evaluation (#24). Paths are relative to the repository root.
# Models, the dataset and results stay local and are git-ignored.

dataset_repo = "pjura/mahjong_souls_tiles"
dataset_revision = "8c0f22e7c6b64be55bb1d2767fe1a63981788de7"
dataset_dir = "ml/data/mahjong_souls_tiles/dataset"
# The dataset has no red-five class: its five folders mix red and plain fives.
# The images listed as red here (judged by eye) are scored as 5mr / 5pr / 5sr.
red_fives = "ml/experiments/2026-10-21-tile-recognition/annotations/dataset_red_fives.json"
splits = ["test", "train"]
models_dir = "ml/models"
results_dir = "ml/results"

# Small crops are upscaled (keeping aspect ratio) so the longer side is at least this.
min_long_side = 224
# Sample the server's memory every this many requests.
rss_every = 25

[server]
binary = "llama-server"
port = 8090
ctx_size = 4096
gpu_layers = 99
startup_timeout_s = 300

[prompt]
# No concrete answers as examples: small models tend to copy them.
text = """This image shows one Japanese riichi mahjong tile from the video game Mahjong Soul. \
It may be rotated or seen at an angle. Which tile is it?
Reply with a number and a suit (characters, circles or bamboo), \
or with a wind (east, south, west or north wind) or a dragon (white, green or red dragon).
- characters: a Chinese numeral above the red character 萬
- circles: round dots; count them
- bamboo: sticks; count them; the one of bamboo shows a bird
- winds: 東 east, 南 south, 西 west, 北 north
- dragons: blank face for white, 發 for green, 中 for red
- if a five is drawn entirely in red, reply "red five" and the suit"""

[models.qwen3-vl-2b]
repo = "Qwen/Qwen3-VL-2B-Instruct-GGUF"
revision = "52d6c8ffea26cc873ac5ad116f8631268d7eb503"
model = "Qwen3VL-2B-Instruct-Q4_K_M.gguf"
mmproj = "mmproj-Qwen3VL-2B-Instruct-Q8_0.gguf"
license = "Apache-2.0"

[models.qwen3-vl-4b]
repo = "Qwen/Qwen3-VL-4B-Instruct-GGUF"
revision = "1cd86afb9a95c410a6038ab3b40d8b578c892266"
model = "Qwen3VL-4B-Instruct-Q4_K_M.gguf"
mmproj = "mmproj-Qwen3VL-4B-Instruct-Q8_0.gguf"
license = "Apache-2.0"

[models."smolvlm2-2.2b"]
repo = "ggml-org/SmolVLM2-2.2B-Instruct-GGUF"
revision = "1bc3c9f74ceafd4c8d4411cc9cf188bba3798f91"
model = "SmolVLM2-2.2B-Instruct-Q4_K_M.gguf"
mmproj = "mmproj-SmolVLM2-2.2B-Instruct-Q8_0.gguf"
license = "Apache-2.0"

# Online reference (needs network and the user's own API key, so it conflicts with
# offline use): https://developers.openai.com/api/docs/guides/decisions
[openai_decisions]
endpoint = "https://api.openai.com/v1/decisions"
model = "gpt-6-luna"
usd_per_million_input_tokens = 0.10
timeout_s = 60

# Request variants. upscale: long side in pixels; detail: input_image detail
# ("high" is undocumented for this endpoint and may be rejected); legend: attach a
# labeled sheet of all tiles from the dataset's clean crops; two_step: ask suit,
# number, honor and red-five as separate questions instead of one 37-way choice.
[openai_decisions.variants.base]

[openai_decisions.variants.up512]
upscale = 512

[openai_decisions.variants.up512-high]
upscale = 512
detail = "high"

[openai_decisions.variants.up512-legend]
upscale = 512
legend = true

[openai_decisions.variants.up512-twostep]
upscale = 512
two_step = true

# Ready-made tile classifier used as the baseline (not a VLM; we do not train it).
# The dataset card links pjura/mahjong_vision, but that repo holds a discard
# model; the image classifier is pjura/mahjong_soul_vision.
[classifier]
repo = "pjura/mahjong_soul_vision"
revision = "ea01ca0bcb9be0fc10a5fa09ee8356770c25adc5"
license = "Apache-2.0"

[mlx_models.qwen3-vl-2b]
repo = "mlx-community/Qwen3-VL-2B-Instruct-4bit"
revision = "9c4f5209e57b31f4b9dfba735de3fb983739c9cc"
license = "Apache-2.0"

[models.internvl3-2b]
repo = "ggml-org/InternVL3-2B-Instruct-GGUF"
revision = "f763aa88f2ad2dbd5246350660fec7d50a20a7b0"
model = "InternVL3-2B-Instruct-Q4_K_M.gguf"
mmproj = "mmproj-InternVL3-2B-Instruct-Q8_0.gguf"
license = "Apache-2.0"
